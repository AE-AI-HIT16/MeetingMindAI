[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "meetasr"
version = "0.1.0"
description = "Meeting Speech Recognition + LLM Summarization — rebuilt from FunASR"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MeetASR Contributors" }]
keywords = [
    "speech-recognition",
    "asr",
    "meeting",
    "llm",
    "summarization",
    "speaker-diarization"
]


dependencies = [
    # Audio
    "librosa>=0.10.2,<1",
    "soundfile>=0.12.1,<1",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",

    # Config
    "omegaconf>=2.0,<3",

    # Model download
    "modelscope>=1.20,<2",
    "huggingface_hub>=0.24,<2",
    "filelock>=3.13,<4",

    # ASR tokenizers
    "transformers>=4.40,<5",
    "sentencepiece>=0.2,<1",

    # API server
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9,<1",
    "pydantic>=2.7,<3",

    # Database
    "sqlmodel>=0.0.22,<1",
    "sqlalchemy>=2.0,<3",

    # LLM
    "openai>=1.50,<3",
    "httpx>=0.27,<1",
    "PyJWT>=2.8,<3",

    # Default multilingual VAD
    "silero-vad==6.2.1",
    "onnxruntime>=1.16.1,<2",

    # Production multilingual ASR backend
    "faster-whisper>=1.2,<2",
    "sherpa-onnx>=1.10,<2",

    # Speaker clustering
    "fastcluster>=1.2.6",
    "scikit-learn>=1.3,<2",

    # Utils
    "python-dotenv>=1.0,<2",

    # Database driver
    "psycopg2-binary>=2.9,<3",
]


# =========================
# Optional dependencies
# =========================

[project.optional-dependencies]

# GPU / heavy ASR stack
gpu = [
    "torch>=2.2",
    "torchaudio>=2.2",
    "funasr>=1.2,<2",
    "qwen-asr>=0.0.6,<0.1",
]


export = [
    "bleach>=6.0",
    "docxcompose>=1.4",
    "docxtpl>=0.19",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    "python-docx>=1.1",
    "weasyprint>=69.0",
]


dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "isort",
    "ruff",
    "pytest-asyncio",
]


s3 = [
    "boto3>=1.34,<2",
]


legacy-llm = [
    "sentence-transformers>=3.0,<6",
    "tiktoken>=0.7,<1",
]


[project.scripts]
meetasr = "meetasr.bin.cli:main"
meetasr-server = "meetasr.bin.cli:main"


[tool.setuptools.packages.find]
include = ["meetasr*"]


[tool.setuptools.package-data]
"meetasr.export" = [
    "fonts/*.ttf",
    "templates/docx/*.docx",
    "templates/pdf/*.html",
]


[tool.black]
line-length = 100
target-version = ["py310"]


[tool.isort]
profile = "black"
line_length = 100


[tool.ruff]
line-length = 100


[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]