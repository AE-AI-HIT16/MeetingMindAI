# Faster-Whisper Large-v3 preset for one 8 GB NVIDIA GPU.
#
# Before running, set:
#   $env:ASR_MODEL_PATH = "D:/MeetingMindAI/models/whisper-large-v3-ct2"
#
# Copy this file to an untracked local config, then adjust component paths as needed.

# Keep auxiliary models on CPU so the GPU is reserved for Whisper.
device: cpu

pipeline:
  gap_rescue:
    # Keep disabled until it passes more timestamped meeting benchmarks.
    enabled: false

asr:
  model: faster-whisper
  hub: none
  model_path: ${oc.env:ASR_MODEL_PATH}
  device: cuda:0
  compute_type: float16
  num_workers: 1

  # Decode one recording at a time. Faster-Whisper's internal VAD keeps the
  # original global timestamps, so MeetPipeline does not cut ASR at external
  # VAD boundaries. Silero VAD remains available for CAM++ diarization.
  vad_filter: true
  vad_parameters:
    min_silence_duration_ms: 500
  hallucination_silence_threshold: 2.0

  # Deterministic Vietnamese baseline. Keep prior text disabled to avoid a
  # mistaken phrase propagating into later speech regions.
  beam_size: 5
  temperature: 0.0
  condition_on_previous_text: false
  compression_ratio_threshold: 2.4
  log_prob_threshold: -1.0
  no_speech_threshold: 0.6

vad:
  model: silero-vad
  backend: onnx
  device: cpu
  threshold: 0.5
  neg_threshold: 0.35
  min_speech_duration_ms: 250
  min_silence_duration_ms: 500
  speech_pad_ms: 80
  max_speech_duration_s: 30

# Whisper already returns punctuation. Establish an ASR baseline before adding
# an external punctuation model.

spk:
  model: cam++
  hub: ms
  device: cpu
