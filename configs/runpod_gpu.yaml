# RunPod GPU runtime config — Qwen3-ASR 0.5B
# Qwen3-ASR produces punctuated, mixed-case text natively; no punc model needed.

device: cuda:0

pipeline:
  transcription_language: vi
  diarization_first:
    enabled: true
    max_chunk_ms: 15000
    boundary_search_ms: 2000
    min_chunk_ms: 1000
  # pyannote segmentation-3.0 (ONNX, CPU): finds overlapped speech, places
  # speaker changes to ~17 ms and drops VAD segments without a voice.
  # Tuned on synthetic meetings (scripts/eval): DER 14.5% -> 7.0%.
  overlap_detection:
    enabled: true
    model: onnx-community/pyannote-segmentation-3.0
    step_s: 1.0            # ~25 s CPU per hour of audio (2.0 halves it, slightly worse)
    boundary_s: 0.0        # moving cam++ speaker changes made DER worse
    supplement: true
    min_speech_ratio: 0.3  # VAD segment needs a voice >= 30% of its length
  # MossFormer2 separation of overlapped regions before ASR (GPU).
  # Recovers interjections spoken over someone else ("dạ", "vâng").
  overlap_separation:
    enabled: true
    model: alibabasglab/MossFormer2_SS_16K

realtime:
  vad:
    frame_ms: 32
    start_threshold: 0.50
    end_threshold: 0.35
    min_speech_ms: 250
    min_silence_ms: 600
    pre_roll_ms: 300
    post_roll_ms: 100
  asr:
    partial_interval_ms: 800
    partial_min_audio_ms: 700
    partial_max_audio_ms: 5000
    max_utterance_ms: 15000

asr:
  model: qwen3-asr
  hub: none
  model_size: Qwen/Qwen3-ASR-0.6B
  device: cuda:0
  dtype: bfloat16
  max_inference_batch_size: 8
  max_new_tokens: 512

vad:
  model: silero-vad
  backend: onnx
  device: cpu
  threshold: 0.5
  neg_threshold: 0.35
  min_speech_duration_ms: 250
  min_silence_duration_ms: 500
  speech_pad_ms: 80
  max_speech_duration_s: 30

spk:
  model: cam++
  hub: ms
  device: cuda:0
  cluster_type: spectral
  # --- Tinh chỉnh diarization (khớp người nói) ---
  # min_cluster_size: cụm ≤ số này bị gộp vào cụm lớn hơn.
  #   Giảm (2) = giữ được người nói ÍT câu; tăng (4+) = bỏ qua phát biểu ngắn.
  min_cluster_size: 2
  # mer_cos: cosine ≥ số này thì gộp 2 người thành 1.
  #   Tăng (0.85) = tách nhạy hơn (người giọng giống vẫn tách);
  #   giảm (0.75) = gộp mạnh hơn (tránh 1 người bị chia đôi).
  mer_cos: 0.80
  # pval: cắt tỉa ma trận tương đồng của spectral clustering.
  #   Giảm (0.008) = dễ tách thành NHIỀU người; tăng (0.02) = gộp lại.
  pval: 0.012
  # Giới hạn số người tự phát hiện (họp thường ≤ 8).
  max_num_spks: 8
  min_num_spks: 1

llm:
  provider: groq
  model: openai/gpt-oss-20b
  api_key: ~
  language: vi
  temperature: 0.3
  max_tokens: 4096
  timeout: 120
  retry_attempts: 3
