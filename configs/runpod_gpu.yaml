# RunPod GPU runtime config — Qwen3-ASR 0.5B
# Qwen3-ASR produces punctuated, mixed-case text natively; no punc model needed.

device: cuda:0

pipeline:
  transcription_language: vi
  diarization_first:
    enabled: true
    max_chunk_ms: 15000
    boundary_search_ms: 2000
    min_chunk_ms: 1000

realtime:
  vad:
    frame_ms: 32
    start_threshold: 0.50
    end_threshold: 0.35
    min_speech_ms: 250
    min_silence_ms: 600
    pre_roll_ms: 300
    post_roll_ms: 100
  asr:
    partial_interval_ms: 800
    partial_min_audio_ms: 700
    partial_max_audio_ms: 5000
    max_utterance_ms: 15000

asr:
  model: qwen3-asr
  hub: none
  model_size: Qwen/Qwen3-ASR-0.5B
  device: cuda:0
  dtype: bfloat16
  max_inference_batch_size: 8
  max_new_tokens: 512

vad:
  model: silero-vad
  backend: onnx
  device: cpu
  threshold: 0.5
  neg_threshold: 0.35
  min_speech_duration_ms: 250
  min_silence_duration_ms: 500
  speech_pad_ms: 80
  max_speech_duration_s: 30

spk:
  model: cam++
  hub: ms
  device: cuda:0
  cluster_type: spectral
  min_cluster_size: 4

llm:
  provider: groq
  model: openai/gpt-oss-20b
  api_key: ~
  language: vi
  temperature: 0.3
  max_tokens: 4096
  timeout: 120
  retry_attempts: 3
