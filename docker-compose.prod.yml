version: "3.8"

# Production compose — chạy trên EC2
# RunPod Serverless xử lý ML, không chạy meetasr_runpod local
#
# Dùng: docker compose -f docker-compose.prod.yml up -d

services:
  meetasr_backend:
    image: tutrananh444/meetasr-backend:latest
    container_name: meetasr_backend
    restart: unless-stopped
    depends_on:
      postgres_db:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      # RunPod Serverless
      RUNPOD_ENDPOINT_ID: ${RUNPOD_ENDPOINT_ID}
      RUNPOD_API_BASE_URL: ${RUNPOD_API_BASE_URL:-https://api.runpod.ai/v2}
      RUNPOD_API_KEY: ${RUNPOD_API_KEY}

      # Database
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD}@postgres_db:5432/${POSTGRES_DB:-meetasr_db}

      # LLM
      GROQ_API_KEY: ${GROQ_API_KEY}

      # Storage
      STORAGE_BACKEND: s3
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-meetasr-audio}
      MINIO_SECURE: "false"
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}

      # Auth
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_DAYS: ${JWT_EXPIRE_DAYS:-30}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  postgres_db:
    image: postgres:15-alpine
    container_name: meetasr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-meetasr_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-meetasr_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: rustfs/rustfs:latest
    container_name: meetasr_minio
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
