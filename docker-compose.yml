version: "3.8"

services:
  # =========================
  # RUNPOD MODEL SERVER
  # =========================
  meetasr_runpod:
    build:
      context: .
      dockerfile: Dockerfile.runpod
    image: khanhsayhi/meetasr-runpod:latest
    container_name: meetasr_runpod
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - RUNPOD_API_KEY=${RUNPOD_API_KEY:-}
    volumes:
      # Hugging Face cache
      - ./model_cache/huggingface:/root/.cache/huggingface
      # ModelScope cache
      - ./model_cache/modelscope:/root/.cache/modelscope
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Uncomment deploy block if running on host with GPU / nvidia-container-toolkit:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # =========================
  # BACKEND (AWS)
  # =========================
  meetasr_backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: khanhsayhi/meetasr-backend:latest
    container_name: meetasr_backend
    restart: unless-stopped
    depends_on:
      meetasr_runpod:
        condition: service_healthy
      postgres_db:
        condition: service_healthy
      minio_storage:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      # ===== RunPod Connection =====
      RUNPOD_URL: ${RUNPOD_URL:-http://meetasr_runpod:8001}
      RUNPOD_API_KEY: ${RUNPOD_API_KEY:-}

      # ===== Database =====
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password123}@postgres_db:5432/${POSTGRES_DB:-meetasr_db}

      # ===== LLM =====
      GROQ_API_KEY: ${GROQ_API_KEY:-}

      # ===== Storage =====
      STORAGE_BACKEND: s3

      # ===== MinIO =====
      MINIO_ENDPOINT: http://minio_storage:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-password123}
      MINIO_BUCKET: ${MINIO_BUCKET:-meetasr-audio}
      MINIO_SECURE: "false"

      # Browser presigned URL
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # =========================
  # POSTGRESQL
  # =========================
  postgres_db:
    image: postgres:15-alpine
    container_name: meetasr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: ${POSTGRES_DB:-meetasr_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-meetasr_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================
  # MINIO
  # =========================
  minio_storage:
    image: minio/minio:latest
    container_name: meetasr_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data: