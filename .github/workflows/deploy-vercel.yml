name: Deploy to Vercel

on:
  push:
    branches:
      - main
      - develop
      - feature/* # Hỗ trợ deploy cả nhánh feature để test

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Rất quan trọng: Báo cho GitHub Actions biết code nằm ở thư mục frontend-next
    defaults:
      run:
        working-directory: ./frontend-next

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI and pnpm
        run: |
          npm install --global vercel@latest
          npm install --global pnpm@9

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          # Environment variables cho MeetASR Backend (RunPod SSL Proxy)
          NEXT_PUBLIC_MEETASR_API: ${{ secrets.NEXT_PUBLIC_MEETASR_API || 'https://matter-urban-ours-miami.trycloudflare.com' }}
          MEETASR_API: ${{ secrets.MEETASR_API || 'https://matter-urban-ours-miami.trycloudflare.com' }}
          NEXT_PUBLIC_WS_HOST: ${{ secrets.NEXT_PUBLIC_WS_HOST || 'https://matter-urban-ours-miami.trycloudflare.com' }}
          # NEXTAUTH_URL bắt buộc phải là URL hợp lệ, ngay cả lúc build.
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL || 'https://frontend-next-three-smoky.vercel.app' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}