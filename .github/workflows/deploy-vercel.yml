name: Deploy to Vercel

on:
  push:
    branches:
      - main
      - develop
      - feature/*
      - duykhanh/test-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend-next

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI and pnpm
        run: |
          npm install --global vercel@latest
          npm install --global pnpm@9

      - name: Create Vercel project config
        run: |
          mkdir -p .vercel

          cat > .vercel/project.json <<EOF
          {
            "orgId": "${VERCEL_ORG_ID}",
            "projectId": "${VERCEL_PROJECT_ID}"
          }
          EOF

          echo "Vercel project config:"
          cat .vercel/project.json

        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Verify Vercel authentication
        run: |
          vercel whoami --token="${VERCEL_TOKEN}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Pull Vercel Environment Variables
        run: |
          vercel env pull .env.local \
            --environment=production \
            --yes \
            --token="${VERCEL_TOKEN}"

          echo "Environment loaded:"
          ls -la .env.local

        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Check environment variables
        run: |
          echo "Available environment keys:"
          grep -E "^[A-Z0-9_]+=" .env.local || true

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Build Project Artifacts
        run: |
          vercel build \
            --prod \
            --token="${VERCEL_TOKEN}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: |
          vercel deploy \
            --prebuilt \
            --prod \
            --token="${VERCEL_TOKEN}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}