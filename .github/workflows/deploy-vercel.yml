name: Deploy to Vercel

on:
  push:
    branches:
      - main
      - develop
      - feature/*
      - duykhanh/test-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Code nằm trong thư mục frontend-next
    defaults:
      run:
        working-directory: ./frontend-next

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Xóa project link cũ
      - name: Remove old Vercel project configuration
        run: |
          rm -rf .vercel
          echo "Old .vercel directory removed."

      - name: Install Vercel CLI and pnpm
        run: |
          npm install --global vercel@latest
          npm install --global pnpm@9

      # Debug để xác nhận GitHub đang dùng project mới
      - name: Verify Vercel configuration
        run: |
          echo "===== VERCEL CONFIG ====="
          echo "VERCEL_ORG_ID=${VERCEL_ORG_ID}"
          echo "VERCEL_PROJECT_ID=${VERCEL_PROJECT_ID}"
          echo "========================="
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Pull Vercel Environment Information
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --token="${VERCEL_TOKEN}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts
        run: |
          vercel build \
            --prod \
            --token="${VERCEL_TOKEN}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_ENDPOINT_ID: ${{ secrets.RUNPOD_ENDPOINT_ID }}

          # NEXTAUTH_URL phải là URL hợp lệ lúc build.
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL || 'https://meeting-mind-ai.vercel.app' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}

      - name: Deploy Project Artifacts to Vercel
        run: |
          vercel deploy \
            --prebuilt \
            --prod \
            --token="${VERCEL_TOKEN}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
