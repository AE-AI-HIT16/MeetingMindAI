name: Deploy to Vercel

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend-next

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI and pnpm
        run: |
          npm install --global vercel@latest
          npm install --global pnpm@9

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Write environment overrides
        run: |
          echo "NEXT_PUBLIC_MEETASR_API=${{ secrets.EC2_BACKEND_URL }}" > .env.production.local
          echo "MEETASR_API=${{ secrets.EC2_BACKEND_URL }}" >> .env.production.local
          echo "NEXT_PUBLIC_WS_HOST=${{ secrets.EC2_BACKEND_URL }}" >> .env.production.local
          echo "NEXTAUTH_URL=${{ secrets.VERCEL_APP_URL }}" >> .env.production.local

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_PUBLIC_MEETASR_API: ${{ secrets.EC2_BACKEND_URL }}
          MEETASR_API: ${{ secrets.EC2_BACKEND_URL }}
          NEXT_PUBLIC_WS_HOST: ${{ secrets.EC2_BACKEND_URL }}
          NEXTAUTH_URL: ${{ secrets.VERCEL_APP_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
