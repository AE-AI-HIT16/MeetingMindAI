name: Backend CI/CD

on:
  push:
    branches:
      - develop

  workflow_dispatch:


env:
  IMAGE_NAME: khanhsayhi/meetasr-backend


jobs:

  test-build-push:

    runs-on: ubuntu-latest

    permissions:
      contents: read


    steps:

      # =========================
      # Checkout
      # =========================

      - name: Checkout source
        uses: actions/checkout@v4



      # =========================
      # Python setup
      # =========================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml



      # =========================
      # System dependencies
      # =========================

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          sudo rm -rf /var/lib/apt/lists/*



      # =========================
      # Install dependencies
      # =========================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel

          pip install --no-cache-dir ".[dev,export,s3,vad-test]"



      # =========================
      # Test
      # =========================

      - name: Run tests
        run: |
          pytest



      # =========================
      # Cleanup before docker build
      # =========================

      - name: Aggressive disk cleanup before Docker build
        run: |
          echo "===== DISK BEFORE AGGRESSIVE CLEAN ====="
          df -h

          # Remove large preinstalled SDKs not needed for Python backend build
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true

          # Docker + temp cleanup
          docker system prune -af --volumes || true
          sudo rm -rf /tmp/* /var/tmp/* || true
          pip cache purge || true

          echo "===== DISK AFTER AGGRESSIVE CLEAN ====="
          df -h



      # =========================
      # Docker
      # =========================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3



      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}



      # =========================
      # Build and push
      # =========================

      - name: Build and push Docker image
        uses: docker/build-push-action@v6

        with:
          context: .
          file: ./Dockerfile

          push: true
          platforms: linux/amd64

          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}



      # =========================
      # Verify image
      # =========================

      - name: Verify Docker image
        run: |
          docker pull ${{ env.IMAGE_NAME }}:latest



      # =========================
      # Deploy EC2
      # =========================

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1

        with:

          host: ${{ secrets.EC2_HOST }}

          username: ${{ secrets.EC2_USERNAME }}

          key: ${{ secrets.EC2_SSH_KEY }}

          timeout: 60s

          command_timeout: 15m


          script: |

            set -e


            echo "========== SERVER INFO =========="

            whoami
            hostname
            uname -a
            df -h



            echo "========== DOCKER INFO =========="

            docker --version
            docker compose version



            echo "========== MOVE PROJECT =========="

            cd /home/ubuntu/Backend



            echo "========== COMPOSE CONFIG =========="

            docker compose config



            echo "========== PULL IMAGE =========="

            docker compose pull meetasr_backend



            echo "========== RESTART SERVICE =========="

            docker compose up -d meetasr_backend



            echo "========== STATUS =========="

            docker ps -a



            echo "========== LOG =========="

            docker logs --tail=100 meetasr_backend || true



            echo "========== CLEAN OLD IMAGES =========="

            docker image prune -af