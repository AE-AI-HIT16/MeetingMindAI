name: Backend CI/CD

on:
  push:
    branches:
      - develop

  workflow_dispatch:

env:
  IMAGE_NAME: khanhsayhi/meetasr-backend


jobs:

  test-build-push:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout source
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install ".[dev,export,s3]"


      - name: Run tests
        run: |
          pytest


      - name: Free disk space
        run: |
          echo "========== BEFORE CLEANUP =========="
          df -h

          docker system prune -af --volumes || true
          docker builder prune -af || true

          pip cache purge || true

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/CodeQL

          echo "========== AFTER CLEANUP =========="
          df -h


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile

          push: true

          no-cache: true

          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}


      # Kiểm tra image vừa push có pull được không
      - name: Verify Docker image
        run: |
          docker pull ${{ env.IMAGE_NAME }}:latest


      # =========================
      # CD - Deploy to EC2
      # =========================

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1

        with:

          host: ${{ secrets.EC2_HOST }}

          username: ${{ secrets.EC2_USERNAME }}

          key: ${{ secrets.EC2_SSH_KEY }}

          timeout: 60s

          command_timeout: 15m


          script: |

            set -e


            echo "========== BASIC INFO =========="

            whoami

            hostname

            pwd



            echo "========== SERVER INFO =========="

            uname -a

            df -h



            echo "========== CHECK HOME =========="

            ls -la /home/ubuntu



            echo "========== CHECK BACKEND DIRECTORY =========="

            ls -la /home/ubuntu/Backend



            echo "========== CHECK DOCKER =========="

            docker --version

            docker compose version



            echo "========== DOCKER SERVICE =========="

            sudo systemctl status docker --no-pager || true



            echo "========== MOVE TO PROJECT =========="

            cd /home/ubuntu/Backend



            echo "========== LIST PROJECT FILES =========="

            ls -la



            echo "========== SHOW COMPOSE FILE =========="

            cat docker-compose.yml



            echo "========== VALIDATE COMPOSE =========="

            docker compose config



            echo "========== PULL IMAGE =========="

            docker compose pull meetasr_backend



            echo "========== START SERVICE =========="

            docker compose up -d meetasr_backend



            echo "========== CONTAINER STATUS =========="

            docker ps -a



            echo "========== CONTAINER LOG =========="

            docker logs --tail=100 meetasr_backend || true



            echo "========== CLEAN UNUSED IMAGE =========="

            docker image prune -f