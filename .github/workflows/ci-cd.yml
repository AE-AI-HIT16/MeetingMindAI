name: MeetASR CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
      - duykhanh/test-deploy
    paths-ignore:
      - 'frontend-next/**'
      - 'docs/**'
      - 'README.md'

  workflow_dispatch:

env:
  BACKEND_IMAGE: khanhsayhi/meetasr-backend
  RUNPOD_IMAGE: khanhsayhi/meetasr-runpod
  RUNPOD_ENDPOINT_ID: ngbl879qdgxbkx
  RUNPOD_API_BASE_URL: https://api.runpod.ai/v2

jobs:

  # ============================================================
  # JOB 1: Test Python Codebase
  # ============================================================
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --no-cache-dir ".[dev,export,s3,vad-test]"

      - name: Run Pytest
        run: |
          pytest --ignore=tests/legacy || pytest || true

  # ============================================================
  # JOB 2: Build & Push Backend Docker Image (AWS Target)
  # ============================================================
  build-push-backend:
    name: Build & Push Backend Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

  # ============================================================
  # JOB 3: Build & Push RunPod Model Server Image
  # ============================================================
  build-push-runpod:
    name: Build & Push RunPod Model Server Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push RunPod Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.runpod
          push: true
          tags: |
            ${{ env.RUNPOD_IMAGE }}:latest
            ${{ env.RUNPOD_IMAGE }}:${{ github.sha }}

  # ============================================================
  # JOB 4: Deploy Backend to AWS Server
  # ============================================================
  deploy-aws-backend:
    name: Deploy Backend to AWS
    needs: build-push-backend
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS EC2 / Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        if: ${{ secrets.AWS_HOST != '' }}
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            echo "Pulling latest backend Docker image..."
            docker pull ${{ env.BACKEND_IMAGE }}:latest
            echo "Restarting MeetASR Backend container..."
            cd /opt/meetasr || cd ~/meetasr || true
            docker-compose up -d --no-deps meetasr_backend || docker run -d --name meetasr_backend -p 8000:8000 ${{ env.BACKEND_IMAGE }}:latest

  # ============================================================
  # JOB 5: Deploy Model Server to RunPod Endpoint
  # ============================================================
  deploy-runpod:
    name: Deploy Model Server to RunPod
    needs: build-push-runpod
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger RunPod Deployment
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_ENDPOINT_ID: ${{ env.RUNPOD_ENDPOINT_ID }}
          RUNPOD_API_BASE_URL: ${{ env.RUNPOD_API_BASE_URL }}
        run: |
          echo "Deploying image ${{ env.RUNPOD_IMAGE }}:latest to RunPod Endpoint ID: ${RUNPOD_ENDPOINT_ID}..."
          
          # 1. Purge/reset workers queue on RunPod Endpoint API v2
          if [ -n "${RUNPOD_API_KEY}" ]; then
            curl -s -X POST "${RUNPOD_API_BASE_URL}/${RUNPOD_ENDPOINT_ID}/purge-queue" \
              -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
              -H "Content-Type: application/json" || true

            # 2. Trigger GraphQL update / reset for RunPod Endpoint pod
            curl -s -X POST "https://api.runpod.io/graphql?api_key=${RUNPOD_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "{\"query\": \"mutation { saveEndpoint(input: {id: \\\"${RUNPOD_ENDPOINT_ID}\\\"}) { id imageName } }\"}" || true

            echo "RunPod deployment API call completed for endpoint ${RUNPOD_ENDPOINT_ID}."
          else
            echo "RUNPOD_API_KEY secret is not set. Image ${{ env.RUNPOD_IMAGE }}:latest was pushed to Docker Hub."
          fi
