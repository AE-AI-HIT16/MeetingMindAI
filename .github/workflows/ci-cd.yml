name: Backend CI/CD

on:
  push:
    branches:
      - develop
    paths-ignore:
      - 'frontend-next/**'
      - 'docs/**'
      - 'README.md'

  workflow_dispatch:


env:
  IMAGE_NAME: khanhsayhi/meetasr-backend


jobs:

  # ============================================================
  # JOB 1: Chạy test trên máy chủ riêng
  # ============================================================
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --no-cache-dir ".[dev,export,s3,vad-test]"

      - name: Run tests
        run: |
          pytest


  # ============================================================
  # JOB 2: Build Docker + Push + Deploy trên máy chủ riêng (ổ cứng sạch)
  # ============================================================
  build-push-deploy:
    runs-on: ubuntu-latest
    needs: test          # Chỉ chạy khi test PASS
    permissions:
      contents: read

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      # Giải phóng ổ cứng triệt để trước khi build Docker
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Check disk space
        run: df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          no-cache: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      # =========================
      # Deploy EC2
      # =========================

      - name: Copy Compose files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,docker-compose.gpu.yml"
          target: "/home/ubuntu/Backend"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1

        with:

          host: ${{ secrets.EC2_HOST }}

          username: ${{ secrets.EC2_USERNAME }}

          key: ${{ secrets.EC2_SSH_KEY }}

          timeout: 60s

          command_timeout: 15m


          script: |

            set -e


            echo "========== SERVER INFO =========="

            whoami
            hostname
            uname -a
            df -h



            echo "========== DOCKER INFO =========="

            docker --version
            docker compose version



            echo "========== MOVE PROJECT =========="

            cd /home/ubuntu/Backend



            echo "========== COMPOSE CONFIG =========="

            docker compose config



            echo "========== CLEAN SYSTEM (FREE DISK SPACE) =========="

            docker system prune -a --volumes -f



            echo "========== PULL IMAGE =========="

            docker compose pull meetasr_backend



            echo "========== RESTART SERVICE =========="

            docker compose up -d meetasr_backend



            echo "========== STATUS =========="

            docker ps -a



            echo "========== LOG =========="

            docker logs --tail=100 meetasr_backend || true



            echo "========== CLEAN OLD IMAGES =========="

            docker image prune -af