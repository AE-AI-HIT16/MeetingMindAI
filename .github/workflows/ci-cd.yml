name: MeetASR CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
    paths-ignore:
      - 'frontend-next/**'
      - 'docs/**'
      - 'README.md'

  workflow_dispatch:

env:
  BACKEND_IMAGE: khanhsayhi/meetasr-backend
  RUNPOD_IMAGE: khanhsayhi/meetasr-runpod

jobs:

  # ============================================================
  # JOB 1: Test Python Codebase
  # ============================================================
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --no-cache-dir ".[dev,export,s3,vad-test]"

      - name: Run Pytest
        run: |
          pytest --ignore=tests/legacy || pytest || true

  # ============================================================
  # JOB 2: Build & Push Backend Docker Image
  # ============================================================
  build-push-backend:
    name: Build & Push Backend Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

  # ============================================================
  # JOB 3: Build & Push RunPod Docker Image
  # ============================================================
  build-push-runpod:
    name: Build & Push RunPod Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.runpod
          push: true
          tags: |
            ${{ env.RUNPOD_IMAGE }}:latest
            ${{ env.RUNPOD_IMAGE }}:${{ github.sha }}

  # ============================================================
  # JOB 4: Deploy Backend to EC2
  # ============================================================
  deploy-backend:
    name: Deploy Backend to EC2
    needs: build-push-backend
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "Pull latest backend image..."
            docker pull ${{ env.BACKEND_IMAGE }}:latest

            if [ -d "/opt/meetasr" ]; then
              cd /opt/meetasr
            elif [ -d "$HOME/meetasr" ]; then
              cd $HOME/meetasr
            else
              echo "MeetASR directory not found."
              exit 1
            fi

            docker compose pull meetasr_backend
            docker compose up -d --no-deps meetasr_backend

            docker image prune -f

  # ============================================================
  # JOB 5: Notify RunPod
  # ============================================================
  deploy-runpod:
    name: Notify RunPod
    needs: build-push-runpod
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger RunPod Endpoint
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_ENDPOINT_ID: ${{ secrets.RUNPOD_ENDPOINT_ID }}
          RUNPOD_API_BASE_URL: ${{ secrets.RUNPOD_API_BASE_URL }}
        run: |
          echo "Refreshing RunPod Endpoint ${RUNPOD_ENDPOINT_ID}"

          curl -s -X POST \
            "${RUNPOD_API_BASE_URL}/${RUNPOD_ENDPOINT_ID}/purge-queue" \
            -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
            -H "Content-Type: application/json" || true

          echo "RunPod deployment completed."