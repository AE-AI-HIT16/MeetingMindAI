# MeetASR — Vietnamese CPU configuration used by the local frontend.
# Copy to meeting_config.yaml, set GROQ_API_KEY, then start the backend.
device: cpu

asr:
  model: zipformer-vi
  hub: hf
  device: cpu
  num_threads: 4

vad:
  model: fsmn-vad
  hub: ms
  max_single_segment_time: 15000
  min_segment_ms: 200

spk:
  model: cam++
  hub: ms
  cluster_type: spectral
  min_cluster_size: 4

punc:
  model: vibert-capu
  hub: hf

