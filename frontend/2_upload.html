<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload - MeetASR (Bright Minimal)</title>
  <style>
    :root {
      --bg-color: #FFFFFF;
      --bg-alt: #F8FAFC;
      --text-primary: #334155;
      --text-secondary: #94A3B8;
      --border-color: #CBD5E1;
      --primary-blue: #3B82F6;
      --primary-blue-hover: #2563EB;
      --primary-blue-light: #EFF6FF;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-alt);
      color: var(--text-primary);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .upload-container {
      width: 100%;
      max-width: 650px;
      padding: 24px;
    }

    .dropzone {
      background-color: var(--bg-color);
      border: 2px dashed var(--primary-blue);
      border-radius: 20px;
      padding: 80px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: all 0.3s ease;
      box-shadow: 0 10px 25px -5px rgb(0 0 0 / 0.05);
    }

    .dropzone:hover {
      background-color: var(--primary-blue-light);
      border-color: var(--primary-blue-hover);
    }

    .dropzone-title {
      font-size: 26px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 12px;
    }

    .dropzone-note {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 32px;
    }

    .btn-primary {
      background-color: var(--primary-blue);
      color: #FFFFFF;
      border: none;
      padding: 14px 36px;
      border-radius: 9999px; /* Pill-shape */
      font-size: 15px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      box-shadow: 0 4px 14px 0 rgba(59, 130, 246, 0.39);
    }

    .btn-primary:hover {
      background-color: var(--primary-blue-hover);
      transform: translateY(-1px);
    }

    .dropzone.is-dragging {
      background-color: var(--primary-blue-light);
      border-color: var(--primary-blue-hover);
      transform: translateY(-2px);
    }

    .feedback {
      margin-top: 16px;
      font-size: 14px;
      min-height: 20px;
    }

    .feedback.info {
      color: var(--primary-blue-hover);
    }

    .feedback.success {
      color: #15803d;
    }

    .feedback.error {
      color: #dc2626;
    }
  </style>
</head>
<body>

  <div class="upload-container">
    <div class="dropzone" id="dropzone">
      <h2 class="dropzone-title">Kéo thả tệp âm thanh</h2>
      <p class="dropzone-note">Lưu ý: Chỉ hỗ trợ tải lên 1 tệp duy nhất mỗi lần</p>
      <button class="btn-primary" id="pick-file-button" type="button">Duyệt file</button>
      <input id="file-input" type="file" accept="audio/*" hidden />
      <div class="feedback" id="upload-status"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
