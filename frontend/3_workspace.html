<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workspace - MeetASR (Bright Minimal)</title>
  <style>
    :root {
      --bg-color: #FFFFFF;
      --bg-alt: #F1F5F9;
      --text-primary: #334155;
      --text-secondary: #64748B;
      --border-color: #E2E8F0;
      
      /* Accents */
      --primary-blue: #3B82F6;
      --primary-blue-bg: #EFF6FF;
      --accent-orange: #F97316;
      --accent-orange-hover: #EA580C;
      
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      font-family: var(--font-family);
      height: 100vh;
      overflow: hidden;
      display: grid;
      grid-template-columns: 25% 50% 25%;
    }

    /* Common Styles */
    .column {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 32px 24px;
    }

    .border-right {
      border-right: 1px solid var(--border-color);
    }

    .section-title {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 24px;
      font-weight: 600;
    }

    /* Column 1 */
    .file-info {
      display: flex;
      align-items: center;
      gap: 16px;
      background-color: var(--primary-blue-bg);
      padding: 16px;
      border-radius: 12px;
    }

    .file-icon svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: var(--primary-blue);
      stroke-width: 2;
    }

    .file-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--primary-blue);
    }

    /* Column 2 */
    .content-area {
      flex: 1;
      overflow-y: auto;
      padding-right: 16px;
    }

    /* Custom scrollbar */
    .content-area::-webkit-scrollbar {
      width: 6px;
    }
    .content-area::-webkit-scrollbar-thumb {
      background-color: var(--border-color);
      border-radius: 10px;
    }

    .transcript-text {
      font-size: 16px;
      line-height: 2.4; /* Line height cực lớn tạo sự thoáng đãng */
      color: var(--text-primary);
      font-weight: 400;
    }
    
    .transcript-text p {
      margin-bottom: 24px;
    }

    /* Column 3 */
    .col-right {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background-color: var(--bg-color);
    }

    .button-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 40px;
    }

    .btn-pastel {
      background: var(--bg-alt);
      border: none;
      color: var(--text-primary);
      padding: 14px 10px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
      text-align: center;
    }

    .btn-pastel:hover {
      background-color: var(--border-color);
    }

    .result-list {
      flex: 1;
      list-style-type: none;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 32px;
    }

    .result-item {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      padding: 12px;
      border-radius: 8px;
      transition: background-color 0.2s;
    }
    
    .result-item:hover {
      background-color: var(--primary-blue-bg);
    }
    
    .result-item svg {
      width: 18px;
      height: 18px;
      stroke: var(--primary-blue);
      fill: none;
      stroke-width: 2;
      margin-right: 12px;
    }

    .btn-accent {
      background-color: var(--accent-orange);
      color: #FFFFFF;
      border: none;
      padding: 18px 32px;
      border-radius: 9999px; /* Rounded-full */
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      box-shadow: 0 4px 14px 0 rgba(249, 115, 22, 0.39);
    }

    .btn-accent:hover {
      background-color: var(--accent-orange-hover);
      transform: translateY(-1px);
    }

  </style>
</head>
<body>

  <!-- Cột 1: Bên Trái -->
  <div class="column border-right">
    <div class="section-title">File người dùng truyền vào</div>
    <div class="file-info">
      <div class="file-icon">
        <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
      </div>
      <div class="file-name">meeting_design_v2.wav</div>
    </div>
  </div>

  <!-- Cột 2: Ở Giữa -->
  <div class="column border-right">
    <div class="section-title">Nội dung file</div>
    <div class="content-area">
      <div class="transcript-text">
        <p>Đang tải dữ liệu...</p>
      </div>
    </div>
  </div>

  <!-- Cột 3: Bên Phải -->
  <div class="column col-right">
    
    <div>
      <!-- Phần trên: 4 nút bấm lưới 2x2 nền pastel -->
      <div class="button-grid">
        <button class="btn-pastel">Summary</button>
        <button class="btn-pastel">Topic</button>
        <button class="btn-pastel">Decision</button>
        <button class="btn-pastel">Action items</button>
      </div>

      <!-- Phần giữa: Danh sách kết quả không tiêu đề -->
      <ul class="result-list">
        <!-- Results will be injected here via JS -->
      </ul>
    </div>

    <!-- Phần dưới: Nút Bắt đầu to bắt mắt, bo tròn hoàn toàn -->
    <div>
      <button class="btn-accent">Bắt đầu xử lý</button>
    </div>

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      // 1. Lấy ID từ URL
      const urlParams = new URLSearchParams(window.location.search);
      const meetingId = urlParams.get('id');
      if (!meetingId) {
        window.location.href = "1_dashboard.html";
        return;
      }

      // Các thẻ DOM cần thao tác
      const fileNameEl = document.querySelector(".file-name");
      const transcriptEl = document.querySelector(".transcript-text");
      const resultListEl = document.querySelector(".result-list");
      const btnProcess = document.querySelector(".btn-accent");
      const tabs = document.querySelectorAll(".btn-pastel");

      // Hàm fomat giây sang phút:giây (01:15)
      const formatTime = (seconds) => {
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = Math.floor(seconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      };

      try {
        // 2. Fetch toàn bộ dữ liệu cuộc họp
        const res = await fetch(`http://127.0.0.1:8000/v1/meetings/${meetingId}/report`);
        if (!res.ok) throw new Error("Không tìm thấy cuộc họp");
        const meeting = await res.json();

        // Cập nhật tên file
        fileNameEl.textContent = meeting.title || "Unknown File";

        // 3. Xử lý trạng thái Pending (Đang chạy AI)
        if (meeting.status !== "completed") {
          btnProcess.textContent = "Đang xử lý AI... (vui lòng đợi)";
          btnProcess.style.backgroundColor = "#94A3B8";
          btnProcess.style.cursor = "not-allowed";
          transcriptEl.innerHTML = "<p>AI đang bóc băng, vui lòng đợi trong giây lát...</p>";
          resultListEl.innerHTML = "";

          // Cứ 3 giây check lại một lần
          const interval = setInterval(async () => {
            const statusRes = await fetch(`http://127.0.0.1:8000/v1/meeting/${meetingId}/status`);
            const statusData = await statusRes.json();
            if (statusData.status === "completed") {
              clearInterval(interval);
              window.location.reload(); // Chạy xong thì tải lại trang để render kết quả
            } else if (statusData.status === "failed") {
              clearInterval(interval);
              btnProcess.textContent = "Xử lý thất bại!";
              btnProcess.style.backgroundColor = "red";
            }
          }, 3000);
          return; // Dừng tại đây, không render tiếp
        }

        // 4. Khi Đã Completed
        btnProcess.textContent = "Đã xử lý xong";
        btnProcess.style.backgroundColor = "#10B981"; // Đổi sang màu xanh báo hiệu thành công
        btnProcess.disabled = true;

        // Render Cột Giữa: Transcript (Câu thoại)
        transcriptEl.innerHTML = "";
        if (meeting.sentences && meeting.sentences.length > 0) {
          meeting.sentences.forEach(s => {
            const p = document.createElement("p");
            const spk = s.speaker !== null ? `[Speaker ${s.speaker}]` : "";
            p.innerHTML = `<strong>[${formatTime(s.start)} - ${formatTime(s.end)}] ${spk}</strong>: ${s.text}`;
            transcriptEl.appendChild(p);
          });
        } else {
          transcriptEl.innerHTML = "<p>Không có nội dung cuộc họp.</p>";
        }

        // Hàm thay đổi nội dung cột phải khi bấm Tab
        const renderTab = (type) => {
          resultListEl.innerHTML = "";
          if (type === "Summary") {
            const sumText = meeting.report?.summary || "Chưa có tóm tắt";
            resultListEl.innerHTML = `<li class="result-item" style="line-height: 1.6;">${sumText}</li>`;
          } else if (type === "Topic") {
            meeting.topics?.forEach(t => {
              resultListEl.innerHTML += `<li class="result-item" style="display:block; margin-bottom:10px;"><strong>${t.title}</strong><br><span style="font-size:14px; color:var(--text-secondary)">${t.description}</span></li>`;
            });
          } else if (type === "Decision") {
            meeting.decisions?.forEach(d => {
              resultListEl.innerHTML += `<li class="result-item">📌 ${d.content} (Bởi: ${d.made_by})</li>`;
            });
          } else if (type === "Action items") {
            meeting.action_items?.forEach(a => {
              const prio = a.priority === "high" ? "🔴" : a.priority === "medium" ? "🟡" : "🟢";
              resultListEl.innerHTML += `<li class="result-item">${prio} ${a.task} - <em>${a.assignee || 'Chưa gán'}</em></li>`;
            });
          }
        };

        // Gắn sự kiện click cho các nút Tab
        tabs.forEach(tab => {
          tab.addEventListener("click", (e) => {
            // Highlight tab đang chọn
            tabs.forEach(t => t.style.backgroundColor = "var(--bg-alt)");
            e.target.style.backgroundColor = "var(--border-color)";
            // Gọi hàm render tương ứng
            renderTab(e.target.textContent.trim());
          });
        });

        // Mặc định tự động click vào tab Summary đầu tiên khi trang vừa load xong
        if (tabs.length > 0) tabs[0].click();

      } catch (error) {
        console.error(error);
        alert("Lỗi khi tải báo cáo cuộc họp!");
      }
    });
  </script>
</body>
</html>
