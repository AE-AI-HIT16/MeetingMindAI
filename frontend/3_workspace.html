<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workspace - MeetASR (Bright Minimal)</title>
  <style>
    :root {
      --bg-color: #FFFFFF;
      --bg-alt: #F1F5F9;
      --text-primary: #334155;
      --text-secondary: #64748B;
      --border-color: #E2E8F0;
      
      /* Accents */
      --primary-blue: #3B82F6;
      --primary-blue-bg: #EFF6FF;
      --accent-orange: #F97316;
      --accent-orange-hover: #EA580C;
      
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      font-family: var(--font-family);
      height: 100vh;
      overflow: hidden;
      display: grid;
      grid-template-columns: 25% 50% 25%;
    }

    /* Common Styles */
    .column {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 32px 24px;
    }

    .border-right {
      border-right: 1px solid var(--border-color);
    }

    .section-title {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 24px;
      font-weight: 600;
    }

    /* Column 1 */
    .file-info {
      display: flex;
      align-items: center;
      gap: 16px;
      background-color: var(--primary-blue-bg);
      padding: 16px;
      border-radius: 12px;
    }

    .file-icon svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: var(--primary-blue);
      stroke-width: 2;
    }

    .file-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--primary-blue);
    }

    /* Column 2 */
    .content-area {
      flex: 1;
      overflow-y: auto;
      padding-right: 16px;
    }

    /* Custom scrollbar */
    .content-area::-webkit-scrollbar {
      width: 6px;
    }
    .content-area::-webkit-scrollbar-thumb {
      background-color: var(--border-color);
      border-radius: 10px;
    }

    .transcript-text {
      font-size: 16px;
      line-height: 2.4; /* Line height cực lớn tạo sự thoáng đãng */
      color: var(--text-primary);
      font-weight: 400;
    }
    
    .transcript-text p {
      margin-bottom: 24px;
    }

    /* Column 3 */
    .col-right {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background-color: var(--bg-color);
    }

    .button-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 40px;
    }

    .btn-pastel {
      background: var(--bg-alt);
      border: none;
      color: var(--text-primary);
      padding: 14px 10px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
      text-align: center;
    }

    .btn-pastel:hover {
      background-color: var(--border-color);
    }

    .btn-pastel.is-selected {
      background-color: var(--primary-blue);
      color: #FFFFFF;
    }

    .result-list {
      flex: 1;
      list-style-type: none;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 32px;
      overflow-y: auto;
    }

    .result-item {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      padding: 12px;
      border-radius: 8px;
      transition: background-color 0.2s;
    }
    
    .result-item:hover {
      background-color: var(--primary-blue-bg);
    }
    
    .result-item svg {
      width: 18px;
      height: 18px;
      stroke: var(--primary-blue);
      fill: none;
      stroke-width: 2;
      margin-right: 12px;
    }

    .btn-accent {
      background-color: var(--accent-orange);
      color: #FFFFFF;
      border: none;
      padding: 18px 32px;
      border-radius: 9999px; /* Rounded-full */
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      box-shadow: 0 4px 14px 0 rgba(249, 115, 22, 0.39);
    }

    .btn-accent:hover {
      background-color: var(--accent-orange-hover);
      transform: translateY(-1px);
    }

    .feedback {
      margin-top: 12px;
      font-size: 13px;
      color: var(--text-secondary);
      min-height: 18px;
    }

    .feedback.success {
      color: #15803d;
    }

    .feedback.error {
      color: #dc2626;
    }

    .result-card {
      background: var(--bg-alt);
      border-radius: 10px;
      padding: 12px;
      border: 1px solid var(--border-color);
    }

    .result-card h4 {
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--primary-blue);
    }

    .result-card pre {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 13px;
      line-height: 1.6;
      font-family: inherit;
    }

  </style>
</head>
<body>

  <!-- Cột 1: Bên Trái -->
  <div class="column border-right">
    <div class="section-title">File người dùng truyền vào</div>
    <div class="file-info">
      <div class="file-icon">
        <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
      </div>
      <div class="file-name" id="selected-file-name">meeting_design_v2.wav</div>
    </div>
  </div>

  <!-- Cột 2: Ở Giữa -->
  <div class="column border-right">
    <div class="section-title">Nội dung file</div>
    <div class="content-area">
      <div class="transcript-text" id="transcript-content">
        <p>Đang chờ xử lý chuyển đổi âm thanh thành văn bản...</p>
      </div>
    </div>
  </div>

  <!-- Cột 3: Bên Phải -->
  <div class="column col-right">
    
    <div>
      <!-- Phần trên: 4 nút bấm lưới 2x2 nền pastel -->
      <div class="button-grid">
        <button class="btn-pastel" type="button" data-option="summary">Summary</button>
        <button class="btn-pastel" type="button" data-option="topic">Topic</button>
        <button class="btn-pastel" type="button" data-option="decisions">Decision</button>
        <button class="btn-pastel" type="button" data-option="actions">Action items</button>
      </div>

      <div class="feedback" id="workspace-status"></div>

      <!-- Phần giữa: Danh sách kết quả không tiêu đề -->
      <div id="analysis-results" class="result-list"></div>
    </div>

    <!-- Phần dưới: Nút Bắt đầu to bắt mắt, bo tròn hoàn toàn -->
    <div>
      <button class="btn-accent" id="start-analysis" type="button">Bắt đầu xử lý</button>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
