<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - MeetASR (Bright Minimal)</title>
  <style>
    :root {
      --bg-color: #FFFFFF;
      --bg-alt: #F8FAFC;
      --text-primary: #334155;
      --text-secondary: #64748B;
      --border-color: #E2E8F0;
      --primary-blue: #3B82F6;
      --primary-blue-light: #EFF6FF;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-alt);
      color: var(--text-primary);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      padding: 48px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 24px;
    }

    .card {
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      background-color: var(--bg-color);
    }

    .card-add {
      border: 2px dashed var(--primary-blue);
      background-color: var(--bg-color);
    }

    .card-add:hover {
      background-color: var(--primary-blue-light);
      transform: translateY(-2px);
    }

    .card-add .icon {
      font-size: 40px;
      font-weight: 300;
      color: var(--primary-blue);
      margin-bottom: 12px;
    }

    .card-add .text {
      font-size: 15px;
      font-weight: 500;
      color: var(--primary-blue);
    }

    .card-file {
      border: 1px solid var(--border-color);
      padding: 24px;
      box-shadow: var(--shadow-sm);
    }

    .card-file:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
      border-color: transparent;
    }

    .card-file .icon {
      margin-bottom: 16px;
      background-color: var(--primary-blue-light);
      padding: 16px;
      border-radius: 50%;
    }
    
    .card-file .icon svg {
      width: 32px;
      height: 32px;
      fill: none;
      stroke: var(--primary-blue);
      stroke-width: 1.5;
    }

    .card-file .filename {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-primary);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="grid">
      <!-- Khối Thêm Mới -->
      <div class="card card-add">
        <div class="icon">+</div>
        <div class="text">Thêm mới</div>
      </div>

      <!-- Khối Danh sách file -->
      <div class="card card-file">
        <div class="icon">
          <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
        </div>
        <div class="filename">meeting_01.wav</div>
      </div>

      <div class="card card-file">
        <div class="icon">
          <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
        </div>
        <div class="filename">project_sync.mp3</div>
      </div>

      <div class="card card-file">
        <div class="icon">
          <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
        </div>
        <div class="filename">interview_05.m4a</div>
      </div>

      <div class="card card-file">
        <div class="icon">
          <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
        </div>
        <div class="filename">design_review.wav</div>
      </div>
      
    </div>
  </div>

</body>
</html>
